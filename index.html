<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101010">
<link rel="manifest" href="manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<title>کتابخانه رمان‌ها</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Changa:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#101010;--card:#1E1E1E;--ink:#E4E4E4;--mute:#9A9A9A;--acc:#A3A3A3;--on:#111111;--line:#3A3A3A;--glass:rgba(255,255,255,.08);--gb:rgba(255,255,255,.16);--red:#E0625E;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#E9E9E9;--card:#F8F8F8;--ink:#1E1E1E;--mute:#6B6B6B;--acc:#4A4A4A;--on:#F4F4F4;--line:#CACACA;--red:#B3322F;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8)}}
:root[data-theme="light"]{--bg:#E9E9E9;--card:#F8F8F8;--ink:#1E1E1E;--mute:#6B6B6B;--acc:#4A4A4A;--on:#F4F4F4;--line:#CACACA;--red:#B3322F;--glass:rgba(255,255,255,.55);--gb:rgba(255,255,255,.8)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 20% 15%,#5a5a5a,transparent 38%),radial-gradient(circle at 85% 55%,#333,transparent 42%),radial-gradient(circle at 10% 95%,#6a6a6a,transparent 34%),var(--bg);color:var(--ink);font-family:"Changa",Tahoma,sans-serif;font-weight:300;font-size:16px;line-height:2;letter-spacing:.01em}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;z-index:5}
h1{margin:0;font-family:"Lalezar","Vazirmatn",sans-serif;font-weight:400;font-size:24px;color:var(--acc);text-shadow:0 1px 0 rgba(255,255,255,.05)}
main{max-width:640px;margin:0 auto;padding:14px 16px 70px}
.card,details{background:var(--glass);backdrop-filter:blur(14px) saturate(140%);-webkit-backdrop-filter:blur(14px) saturate(140%);border:1px solid var(--gb);border-radius:22px;padding:14px;margin:0 0 12px;box-shadow:0 4px 24px rgba(0,0,0,.12)}
details{padding:4px 14px}
summary{cursor:pointer;color:var(--acc);font-weight:700;padding:10px 0}
h2{margin:0;font-family:"Lalezar","Vazirmatn",sans-serif;font-weight:400;font-size:21px;line-height:1.7;direction:auto;text-align:start;padding-bottom:6px;border-bottom:1px solid var(--line)}
.meta{color:var(--mute);font-size:14px}
.card{position:relative}
#stats{font-size:15px}
.big{color:var(--acc);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
a.btn,button,select{font:inherit;font-size:15px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:7px 13px;cursor:pointer;text-decoration:none;line-height:1.6;text-align:center}
select{background:var(--bg);padding:4px 8px;font-size:14px}
.main{background:var(--acc);color:var(--on);border-color:var(--acc);font-weight:700;flex:1}
.on{border-color:var(--acc);color:var(--acc)}
#flt button{width:100%;text-align:start;background:linear-gradient(180deg,rgba(255,255,255,.05),transparent);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.del{color:var(--red)}
input,textarea{font:inherit;font-size:16px;width:100%;margin:4px 0 10px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[dir=ltr]{text-align:left}
label{font-size:14px;color:var(--mute)}
.edit,.more{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.open{display:block}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 6px,transparent 6px 12px),linear-gradient(90deg,var(--mute),var(--acc))}
.q{border-top:1px solid var(--line);padding:6px 0}
.q p{margin:2px 0}
#gl{width:70px;display:inline-block;margin:0 6px;padding:2px 8px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--acc);color:var(--on);border-radius:12px;padding:10px 14px;font-weight:700;display:none;z-index:20;text-align:center}
</style></head><body>
<header><h1>کتابخانه رمان‌ها</h1><button id="th" type="button">تیره / روشن</button></header>
<main>
<div class="card" id="stats"></div>
<div id="flt" style="display:flex;flex-direction:column;gap:8px;margin:0 0 12px"></div>
<div id="list"></div>
<details id="addbox"><summary>+ افزودن رمان</summary>
<label>نام رمان</label><input id="nt" type="text">
<label>لینک چپتری که توشی</label><input id="nu" type="url" dir="ltr" placeholder="https://mangaup.ir/novel/...">
<label>شماره چپتر</label><input id="nc" type="number" inputmode="numeric" min="0">
<button class="main" id="addbtn" type="button" style="width:100%">ذخیره</button>
</details>
<details><summary>پشتیبان‌گیری</summary>
<div class="row"><button class="main" id="bk" type="button">کپی پشتیبان</button></div>
<label>برای بازگردانی، متن پشتیبان رو اینجا بچسبون</label>
<textarea id="rs" rows="3" dir="ltr"></textarea>
<button id="rb" type="button" style="width:100%">بازگردانی</button>
</details>
<p class="meta">اطلاعات فقط روی همین گوشی ذخیره می‌شه. اگه داده‌های Chrome پاک بشه، از بین می‌ره؛ پس گاهی پشتیبان بگیر.</p>
</main>
<div id="toast"></div>
<script>
var K='novels:v2',LK='novels:log',GK='novels:goal',store=[],log={},goal=5,flt='all';
var seed=[{id:'n1',title:'Reverend Insanity',url:'https://mangaup.ir/novel/153/reader/19136',ch:702}];
var ST={r:'در حال خوندن',w:'می‌خوام بخونم',d:'تموم‌شده'},ORD={r:0,w:1,d:2};
function rd(k){try{return localStorage.getItem(k)}catch(e){return null}}
function wr(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(){
 var r=rd(K)||rd('novels:v1');
 try{store=r?JSON.parse(r):seed.slice()}catch(e){store=seed.slice()}
 try{log=JSON.parse(rd(LK)||'{}')}catch(e){log={}}
 goal=parseInt(rd(GK),10)||5;
 store.forEach(function(n){n.st=n.st||'r';n.t=n.t||0;n.note=n.note||'';n.q=n.q||[]});
}
function save(){wr(K,JSON.stringify(store));wr(LK,JSON.stringify(log))}
function fa(n){try{return Number(n).toLocaleString('fa-IR',{useGrouping:false})}catch(e){return n}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function en(s){return String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function toast(t){var e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){e.style.display='none'},2600)}
function p2(x){return x<10?'0'+x:''+x}
function dk(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function addRead(k){if(k>0){var t=dk(new Date());log[t]=(log[t]||0)+k}}
function stats(){var now=new Date(),w=0,s=0,i,d;
 for(i=0;i<7;i++){d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);w+=log[dk(d)]||0}
 var t=log[dk(now)]||0;i=t?0:1;
 while(true){d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);if(log[dk(d)]){s++;i++}else break}
 return{t:t,w:w,s:s}}
function bump(u,d){var ok=false;var r=u.replace(/(\d+)(?=\/?(?:\?.*)?$)/,function(m){ok=true;return String(Math.max(0,+m+d))});return ok?r:null}
function lastNum(u){var m=u.match(/(\d+)\/?(?:\?.*)?$/);return m?+m[1]:null}
function chFromTitle(t){var m=en(t).match(/(?:چپتر|فصل|chapter|ch\.?)\s*(\d+)/i);return m?+m[1]:null}
function applyLink(n,u,title){
 if(u===n.url)return false;
 var c=chFromTitle(title||''),a=lastNum(n.url),b=lastNum(u),nc;
 if(c!==null)nc=c;else if(a!==null&&b!==null&&b>a)nc=n.ch+(b-a);else nc=n.ch+1;
 addRead(nc-n.ch);n.url=u;n.ch=nc;n.t=Date.now();return true}
function renderStats(){
 var s=stats(),tot=0;store.forEach(function(n){tot+=n.ch||0});
 document.getElementById('stats').innerHTML='<div>چپتر خونده‌شده: <span class="big">'+fa(tot)+'</span></div>'+
 '<div class="meta">امروز: '+fa(s.t)+' · این هفته: '+fa(s.w)+' · روزهای پیاپی: '+fa(s.s)+'</div>'}
function renderFlt(){
 var f=[['all','همه'],['r',ST.r],['w',ST.w],['d',ST.d]];
 document.getElementById('flt').innerHTML=f.map(function(x){return '<button type="button" class="'+(flt===x[0]?'on':'')+'" data-flt="'+x[0]+'">'+x[1]+'</button>'}).join('')}
function card(n){
 var opts=Object.keys(ST).map(function(k){return '<option value="'+k+'"'+(n.st===k?' selected':'')+'>'+ST[k]+'</option>'}).join('');
 var qs=n.q.map(function(q,i){return '<div class="q"><span class="meta">چپتر '+fa(q.c)+'</span><p dir="auto">'+esc(q.x)+'</p><button class="del" type="button" data-a="dq" data-i="'+i+'">حذف</button></div>'}).join('');
 return '<div class="card" data-id="'+n.id+'"><h2>'+esc(n.title)+'</h2>'+
 '<div class="meta">چپتر فعلی: <span class="big">'+fa(n.ch)+'</span> <select data-f="st">'+opts+'</select></div>'+
 '<div class="row"><a class="btn main" href="'+esc(n.url)+'" target="_blank" rel="noopener">ادامه بخوان</a><button class="main" type="button" data-a="next">چپتر بعدی</button></div>'+
 '<div class="row"><button type="button" data-a="paste">ثبت از کلیپ‌بورد</button><button type="button" data-a="prev">قبلی</button><button type="button" data-a="more">جمله و یادداشت</button><button type="button" data-a="edit">ویرایش</button></div>'+
 '<div class="more"><label>یادداشت</label><textarea rows="3" data-f="note" dir="auto">'+esc(n.note)+'</textarea>'+qs+
 '<label>جمله‌ی جدید (شماره چپتر و متن)</label><input type="number" inputmode="numeric" min="0" value="'+n.ch+'" data-f="qc"><textarea rows="2" data-f="qx" dir="auto"></textarea><button class="main" type="button" data-a="aq" style="width:100%">افزودن جمله</button></div>'+
 '<div class="edit"><label>رفتن به چپتر مشخص</label><div class="row"><input type="number" inputmode="numeric" min="0" data-f="go" style="margin:0;flex:1"><button type="button" data-a="go">برو</button></div><label>شماره چپتر</label><input type="number" inputmode="numeric" min="0" value="'+n.ch+'" data-f="ch"><label>لینک چپتر</label><input type="url" dir="ltr" value="'+esc(n.url)+'" data-f="url">'+
 '<div class="row"><button class="main" type="button" data-a="save">ذخیره</button><button class="del" type="button" data-a="del">حذف</button></div></div></div>'}
function render(){
 renderStats();renderFlt();
 var l=store.filter(function(n){return flt==='all'||n.st===flt}).sort(function(a,b){return ORD[a.st]-ORD[b.st]||b.t-a.t});
 document.getElementById('list').innerHTML=l.length?l.map(card).join(''):'<p class="meta">رمانی توی این بخش نیست.</p>'}
function tog(card,cls){var e=card.querySelector('.'+cls);e.classList.toggle('open')}
document.getElementById('list').addEventListener('click',function(e){
 var b=e.target.closest('button');if(!b)return;
 var card=b.closest('.card'),id=card.getAttribute('data-id'),n=store.filter(function(x){return x.id===id})[0],a=b.getAttribute('data-a');
 if(a==='edit')tog(card,'edit');
 if(a==='more')tog(card,'more');
 if(a==='next'||a==='prev'){var d=a==='next'?1:-1,u=bump(n.url,d);
  if(!u){card.querySelector('.edit').classList.add('open');toast('لینک عدد آخر نداره؛ دستی ویرایش کن');return}
  if(d>0)addRead(1);n.url=u;n.ch=Math.max(0,n.ch+d);n.t=Date.now();save();render();if(d>0)window.open(u,'_blank')}
 if(a==='paste'){if(!navigator.clipboard||!navigator.clipboard.readText){toast('کلیپ‌بورد پشتیبانی نمی‌شه');return}
  navigator.clipboard.readText().then(function(t){var m=t.match(/https?:\/\/\S+/);if(!m){toast('لینکی توی کلیپ‌بورد نیست');return}
   var ok=applyLink(n,m[0],t.replace(m[0],''));save();render();toast(ok?'ثبت شد: چپتر '+fa(n.ch):'این لینک همونه که بود')},function(){toast('اجازه‌ی کلیپ‌بورد داده نشد')})}
 if(a==='save'){var ch=parseInt(card.querySelector('[data-f=ch]').value,10),u2=card.querySelector('[data-f=url]').value.trim();
  if(!isNaN(ch)){addRead(ch-n.ch);n.ch=ch}if(u2)n.url=u2;n.t=Date.now();save();render()}
 if(a==='aq'){var qc=parseInt(card.querySelector('[data-f=qc]').value,10),qx=card.querySelector('[data-f=qx]').value.trim();
  if(qx){n.q.push({c:isNaN(qc)?n.ch:qc,x:qx});save();render()}}
 if(a==='go'){var tg=parseInt(card.querySelector('[data-f=go]').value,10);if(isNaN(tg)||tg<0){toast('شماره چپتر رو بنویس');return}var nu=bump(n.url,tg-n.ch);if(!nu){toast('لینک عدد آخر نداره؛ دستی ویرایش کن');return}if(tg>n.ch)addRead(tg-n.ch);n.url=nu;n.ch=tg;n.t=Date.now();save();render();toast('رفتی به چپتر '+fa(tg))}
 if(a==='dq'){n.q.splice(+b.getAttribute('data-i'),1);save();render()}
 if(a==='del'){if(b.getAttribute('data-sure')){store=store.filter(function(x){return x.id!==id});save();render()}else{b.setAttribute('data-sure','1');b.textContent='مطمئنی؟ دوباره بزن'}}
});
document.getElementById('list').addEventListener('change',function(e){
 var f=e.target.getAttribute('data-f'),card=e.target.closest('.card');if(!card)return;
 var n=store.filter(function(x){return x.id===card.getAttribute('data-id')})[0];
 if(f==='st'){n.st=e.target.value;save();render()}
 if(f==='note'){n.note=e.target.value;save()}});
document.getElementById('flt').addEventListener('click',function(e){var b=e.target.closest('button');if(b){flt=b.getAttribute('data-flt');render()}});
document.getElementById('stats').addEventListener('change',function(e){if(e.target.id==='gl'){goal=Math.max(1,parseInt(e.target.value,10)||5);wr(GK,String(goal));renderStats()}});
document.getElementById('addbtn').onclick=function(){
 var t=document.getElementById('nt').value.trim(),u=document.getElementById('nu').value.trim(),c=parseInt(document.getElementById('nc').value,10);
 if(!t||!u){toast('نام و لینک لازمه');return}
 store.push({id:'n'+Date.now(),title:t,url:u,ch:isNaN(c)?0:c,st:'r',t:Date.now(),note:'',q:[]});save();render();
 ['nt','nu','nc'].forEach(function(i){document.getElementById(i).value=''});document.getElementById('addbox').open=false};
document.getElementById('bk').onclick=function(){var t=JSON.stringify({s:store,l:log,g:goal});
 if(navigator.clipboard){navigator.clipboard.writeText(t).then(function(){toast('کپی شد. جایی مثل یادداشت ذخیره‌ش کن')},function(){toast('کپی نشد')})}else{toast('کپی پشتیبانی نمی‌شه')}};
document.getElementById('rb').onclick=function(){try{var d=JSON.parse(document.getElementById('rs').value);
 if(Array.isArray(d)){store=d}else{store=d.s;log=d.l||{};goal=d.g||5;wr(GK,String(goal))}
 if(!Array.isArray(store))throw 0;store.forEach(function(n){n.st=n.st||'r';n.t=n.t||0;n.note=n.note||'';n.q=n.q||[]});save();render();toast('بازگردانی شد')}catch(e){toast('متن پشتیبان درست نیست')}};
document.getElementById('th').onclick=function(){var r=document.documentElement,d=matchMedia('(prefers-color-scheme: dark)').matches,cur=r.getAttribute('data-theme')||(d?'dark':'light');r.setAttribute('data-theme',cur==='dark'?'light':'dark')};
load();
(function(){var p=new URLSearchParams(location.search),s=(p.get('url')||'')+' '+(p.get('text')||''),m=s.match(/https?:\/\/\S+/);
 if(m){var u=m[0],title=(p.get('title')||'')+' '+(p.get('text')||'').replace(u,''),id=(u.match(/\/novel\/(\d+)/)||[])[1],n=null;
  if(id)store.forEach(function(x){var y=(x.url.match(/\/novel\/(\d+)/)||[])[1];if(y===id)n=x});
  if(n){var ok=applyLink(n,u,title);save();setTimeout(function(){toast(ok?n.title+': چپتر '+fa(n.ch):'این لینک همونه که بود')},300)}
  else{document.getElementById('nu').value=u;document.getElementById('addbox').open=true;setTimeout(function(){toast('این رمان رو اضافه کن')},300)}
  history.replaceState(null,'',location.pathname)}})();
render();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script></body></html>
